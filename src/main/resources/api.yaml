components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
  responses:
    InvalidRequest:
      description: Missing, malformed or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Invalid credentials or unauthenticated session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Missing or invalid CSRF token or insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Role:
      type: string
      enum: [ADMIN, USER]
      description: ADMIN 为管理员，USER 为一般用户
    RoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
    UserSummary:
      type: object
      required: [id, username, role, enabled, createdAt, createdBy, updatedAt, updatedBy, isDeleted, displayName, email, phone, currency, timezone, monthlyBudget, budgetStartDay]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
        createdAt:
          type: string
          description: 数据库创建时间，ISO 本地日期时间格式，不包含时区偏移
          example: '2026-10-09T12:30:00.123456'
        createdBy:
          type: string
          description: 创建用户名或 SYSTEM、LEGACY 标记
        updatedAt:
          type: string
          description: 数据库修改时间，ISO 本地日期时间格式，不包含时区偏移
          example: '2026-10-09T12:30:00.123456'
        updatedBy:
          type: string
          description: 最后修改用户名或 SYSTEM、LEGACY 标记
        isDeleted:
