openapi: 3.0.3
info:
  title: Smart Finance API
  version: 0.0.1
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        '200':
          description: Application is running
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrf
      description: Get a CSRF token and retain the session cookie; refresh after login.
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: Authenticate with username and password; requires the CSRF header and session cookie.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; retain the rotated JSESSIONID cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
  responses:
    InvalidRequest:
      description: Missing, malformed or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Invalid credentials or unauthenticated session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Missing or invalid CSRF token or insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '\S+'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
    UserResponse:
      type: object
      required: [username]
      properties:
        username:
          type: string
    CsrfResponse:
      type: object
      required: [token, headerName, parameterName]
      properties:
        token:
          type: string
        headerName:
          type: string
        parameterName:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
