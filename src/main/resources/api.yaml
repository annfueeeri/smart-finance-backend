openapi: 3.0.3
info:
  title: Smart Finance API
  version: 0.0.7
  description: |
    Smart Finance uses a JSESSIONID cookie and CSRF protection.
    First GET /api/auth/csrf and retain its cookie. Send the returned token in
    X-CSRF-TOKEN for registration, login and logout. Registration creates an
    account without signing in; log in separately and refresh CSRF after login.
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 检查应用是否能够响应
      description: 返回 status=UP，确认 HTTP 服务正在响应；不检查数据库或其他外部依赖。
      responses:
        '200':
          description: Application is running
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrf
      summary: 获取当前会话的 CSRF 令牌
      description: 返回令牌及其请求头和参数名称；同时保留会话 Cookie，登录成功后重新获取令牌。
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册账号
      description: |
        创建账号，不自动登录。displayName 为独立的姓名或昵称，1–80 个字符；username 为唯一登录账号，
        支持普通用户名、中文用户名、数字账号或邮箱形式，1–64 个非空白字符，不要求邮箱格式。
        email 和 phone 为可选联系资料，未填写时保存为空字符串，联系邮箱不是额外登录账号。
        currency、timezone、monthlyBudget、budgetStartDay 保存记账偏好；金额以十进制字符串传递，
        不表示现有演示账目已开启预算计算或多币种换算。password 至少
        8 个字符、最多 72 个 UTF-8 字节，且不能全为空白；confirmPassword
        必须与 password 完全一致。密码仅以 BCrypt 哈希保存。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 账号创建成功，返回用户名；之后需调用登录接口
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 用户名已被注册（USERNAME_TAKEN），不会覆盖原账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 校验数据库账号并建立登录会话
      description: |
        使用用户名查询数据库，通过 BCrypt 校验密码并检查账号启用及逻辑删除状态。
        请求必须携带同一会话的 Cookie 和 CSRF 请求头。成功后轮换 JSESSIONID，
        返回用户名和身份，并保存服务端登录状态；浏览器需保留新 Cookie 并刷新 CSRF 令牌。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; retain the rotated JSESSIONID cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 查询当前登录用户
      description: 返回当前会话的用户名和数据库最新身份，不返回密码哈希；未登录、会话失效、账号禁用或逻辑删除时返回 401。
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出登录并销毁会话
      description: 要求有效会话和当前 CSRF 令牌；销毁服务端会话并清除认证信息，刷新页面后仍需重新登录。
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users:
    get:
      tags: [Users]
      operationId: listVisibleUsers
      summary: 查询当前用户可见的用户一览
      description: |
        使用当前会话的数据库身份决定查询范围。管理员查看全部未删除账号，一般用户仅查看自己。
        返回主键、用户名、身份、启用状态、创建及修改审计信息和删除标记，不返回密码或密码哈希。
        不接受指定其他用户的查询参数；被降级的管理员下一次请求即只返回自己的信息。
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 当前用户可见的用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 管理员查询用户列表
      description: 仅 ADMIN 可访问；仅返回未删除账号的身份和启用状态，不返回密码或密码哈希。
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/users/{id}/role:
    put:
      tags: [Users]
      operationId: updateUserRole
      summary: 管理员修改用户身份
      description: |
        仅 ADMIN 可操作，要求 Session Cookie 和 CSRF 请求头。
        身份写入数据库，目标用户下一次请求即使用新权限。
        不允许将最后一个启用的管理员降级为一般用户。
        已删除用户按用户不存在处理；修改时间和实际操作者由后端写入，不接受客户端审计字段。
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: 修改成功，返回最新用户身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 用户不存在（USER_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 不能降级最后一个启用的管理员（LAST_ADMIN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/ledger/options:
    get:
      tags:
      - Ledger
      operationId: getLedgerOptions
      summary: 获取本人账户、分类和记账偏好
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerOptions'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/accounts:
    post:
      tags:
      - Ledger
      operationId: createLedgerAccount
      summary: 新增本人账户
      security:
      - sessionAuth: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAccount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: ACCOUNT_DUPLICATE 同名同币种账户已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerAccountInput'
  /api/transactions:
    get:
      tags:
      - Ledger
      operationId: listLedgerEntries
      summary: 按类型、日期闭区间和账户分页查看本人流水
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntryPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 本人账户不存在（包括其他人的账户）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - INCOME
          - EXPENSE
      - in: query
        name: start
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: end
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: accountId
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: page
        schema:
          type: integer
          default: 0
          minimum: 0
      - in: query
        name: size
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    post:
      tags:
      - Ledger
      operationId: createLedgerEntry
      summary: 新增本人收入或支出，账户与类型分类必须对应
      security:
      - sessionAuth: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 本人账户不存在（包括其他人的账户）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerEntryInput'
  /api/transactions/import/inspect:
    post:
      tags:
      - Ledger
      operationId: ledgerImportInspect
      summary: 读取文件列名与样例
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerInspection'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV（可含 BOM）、XLS 或 XLSX；5MB/500 行/30 列，首行为表头；Excel 首张工作表，不接受公式
  /api/transactions/import/preview:
    post:
      tags:
      - Ledger
      operationId: ledgerImportPreview
      summary: 字段映射、逐行预览及重复与异常提示（不写入）
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPreview'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - mapping
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV（可含 BOM）、XLS 或 XLSX；5MB/500 行/30 列，首行为表头；Excel 首张工作表，不接受公式
                mapping:
                  type: string
                  description: LedgerMapping 的 JSON 字符串。账户名称只匹配本人账户，重名需 currency 列区分。日期 YYYY-MM-DD 或 YYYY/M/D；金额正数可有标准千分组；类型和分类接受代码/中日文。
  /api/transactions/import:
    post:
      tags:
      - Ledger
      operationId: commitLedgerImport
      summary: 确认导入：重新验证全部记录，默认跳过重复，失败整批回滚
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerImportResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 本人账户不存在（包括其他人的账户）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerImportInput'
      description: 相同账户、方向、金额、日期、分类、商家、备注和标准化标签视为重复；仅在本人未删除流水中比较。每批最多500条；前端明确排除预览错误行后提交有效行。创建/修改用户来自认证会话。
  /api/transactions/export:
    get:
      tags:
      - Ledger
      operationId: exportLedgerEntries
      summary: 导出本人筛选范围内全部流水，最多10000条（超限返回400）
      security:
      - sessionAuth: []
      responses:
        '200':
          description: CSV（UTF-8 BOM、公式转义）或 XLSX（文字单元格）；列 kind,amount,date,account,category,merchant,note,currency，可重新导入
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 本人账户不存在（包括其他人的账户）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - INCOME
          - EXPENSE
      - in: query
        name: start
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: end
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: accountId
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - xlsx
          default: csv
  /api/budgets:
    get:
      tags:
      - Budget
      operationId: listBudgets
      summary: 查询本人预算执行、超支和趋势
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetOverview'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: BUDGET_NOT_FOUND：本人记录不存在，不泄露其他用户数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: start
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: end
        required: false
        schema:
          type: string
          format: date
      description: 按日期闭区间重叠筛选；管理员也仅本人数据。不合并币种或总预算与分类预算。读取同步刷新自动结转和站内提醒，后台也每分钟刷新。
    post:
      tags:
      - Budget
      operationId: createBudget
      summary: 新增总预算、分类预算、周期预算
      security:
      - sessionAuth: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: BUDGET_NOT_FOUND：本人记录不存在，不泄露其他用户数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: BUDGET_CONFLICT：同名模板或同分类/币种/周期类型/日期范围预算已存在，整批操作回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetInput'
      description: MONTH 为完整暦月；WEEK 为周一至周日；QUARTER 为标准季度；YEAR 为完整暦年；CUSTOM 任意日期闭区间。日期范围前后十年，周期最多3661天。只有 MONTH 支持结转。ONCE
        仅转移基础预算未使用部分，CUMULATIVE 含收到的结转。金额大于0，按币种验证小数。注册预算不自动创建。
  /api/budgets/{id}:
    put:
      tags:
      - Budget
      operationId: adjustBudget
      summary: 调整额度、预警阈值、结转策略并保存前后金额
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: BUDGET_NOT_FOUND：本人记录不存在，不泄露其他用户数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: BUDGET_CONFLICT：同名模板或同分类/币种/周期类型/日期范围预算已存在，整批操作回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetAdjustmentInput'
      description: 日期、归属、分类和币种固定。可调整历史额度并重算后续结转；理由必填。thresholds 1至100，最多10个不重复整数。
  /api/budgets/{id}/adjustments:
    get:
      tags:
      - Budget
      operationId: getBudgetAdjustments
      summary: 读取手动调整及自动结转修正历史
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetAdjustment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: BUDGET_NOT_FOUND：本人记录不存在，不泄露其他用户数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
