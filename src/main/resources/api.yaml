          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: ACCOUNT_NOT_FOUND 本人账户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 所有金额用十进制字符串；不限制前10000笔流水。商家排行前20名；标签统计可重叠，收支合计不重复。分类趋势独立取截至end的最近六个自然月，终点月截至end。环比/同比将同一日期区间按日历移动月/年，完整月份保持首末日；百分比比较基数为零时返回null。账户现金流和资产/余额仅应用日期/账户/币种，内部转账不计入收入和支出。资产历史采用期初基准加流水和最近日终估值；基准前unknown，不伪造银行余额。
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 闭区间开始；默认用户时区本月1日；1900至9998年。
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 闭区间结束；默认用户时区今天。
      - name: grouping
        in: query
        required: false
        schema:
          type: string
          enum:
          - DAY
          - WEEK
          - MONTH
          - YEAR
          default: MONTH
        description: 按日/周一至周日/月/年分组，补齐零流水；DAY最多366天，其他最多3661天。
      - name: accountId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
        description: 仅本人账户；管理员也不能读取他人财务。
      - name: currency
        in: query
        required: false
        schema:
          type: string
        description: ISO4217有效币种；省略时各币种分别统计。
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - INCOME
          - EXPENSE
        description: 只筛选收支分析，现金流/余额仍使用完整所选账户流水。
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - SALARY
          - BONUS
          - PART_TIME
          - INVESTMENT
          - INTEREST
          - GIFT
          - OTHER_INCOME
          - FOOD
          - SHOPPING
          - TRANSPORT
          - HOUSING
          - ENTERTAINMENT
          - MEDICAL
          - OTHER_EXPENSE
        description: 只筛选收支分析和六个月分类趋势。
      - name: tag
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 30
        description: 只筛选收支分析；标签精确匹配。
