spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: smart-finance-backend
  profiles:
    default: local
  datasource:
    druid:
      validation-query: SELECT 1
  jpa:
    open-in-view: false
  batch:
    job:
      enabled: false
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
